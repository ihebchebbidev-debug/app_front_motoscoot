<!DOCTYPE html>
<html lang="fr" class="scroll-smooth" data-pre-hydrate>
  <head>
    <meta charset="UTF-8" />
    <!-- viewport: dropped maximum-scale/user-scalable=no — those harm a11y and Lighthouse. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#E25C00" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1116" media="(prefers-color-scheme: dark)" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Baseline SEO (overridden per-route by components/common/SEO.tsx). These
         live in source HTML so ndeon-JS crawlers (LLM training bots without JS,
         older indexers, social previews when JS fails) still see meaningful
         metadata before React mounts. -->
    <title>Motos et Scooters en Tunisie | Neufs & Occasion</title>
    <meta name="description" content="Trouvez, vendez et comparez des motos et scooters en Tunisie : annonces neuves et d'occasion, prix, fiches techniques et nouveautés du marché." />
    <meta name="keywords" content="moto occasion Tunisie, scooter occasion Tunisie, vente moto Tunis, achat moto Sousse, moto pas cher Sfax, MotoScoot, moto-scoot.tn" />
    <meta name="author" content="MotoScoot Tunisie" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MotoScoot.tn" />
    <meta property="og:locale" content="fr_TN" />
    <meta property="og:title" content="Motos et Scooters en Tunisie | Neufs & Occasion" />
    <meta property="og:description" content="Trouvez, vendez et comparez des motos et scooters en Tunisie : annonces neuves et d'occasion, prix, fiches techniques et nouveautés du marché." />
    <meta property="og:url" content="https://www.moto-scoot.tn/" />
    <meta property="og:image" content="https://www.moto-scoot.tn/og-banner.webp" />
    <meta property="og:image:secure_url" content="https://www.moto-scoot.tn/og-banner.webp" />
    <meta property="og:image:type" content="image/webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MotoScoot.tn — Achat et vente de motos et scooters en Tunisie" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@motoscoot_tn" />
    <meta name="twitter:creator" content="@motoscoot_tn" />
    <meta name="twitter:title" content="Motos et Scooters en Tunisie | Neufs & Occasion" />
    <meta name="twitter:description" content="Trouvez, vendez et comparez des motos et scooters en Tunisie : annonces neuves et d'occasion, prix, fiches techniques et nouveautés du marché." />
    <meta name="twitter:image" content="https://www.moto-scoot.tn/og-banner.webp" />
    <meta name="twitter:image:alt" content="MotoScoot.tn — Achat et vente de motos et scooters en Tunisie" />

    <link rel="icon" type="image/svg+xml" href="https://www.moto-scoot.tn/site-logo/favicon.svg" />
    <link rel="apple-touch-icon" href="https://www.moto-scoot.tn/site-logo/favicon.svg" />

    <!-- Network preconnects: only the origins we actually load assets from. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://www.moto-scoot.tn" crossorigin />
    <link rel="dns-prefetch" href="https://www.moto-scoot.tn" />
    <!-- Data service: every home section fetches from it (PageSpeed: ~300 ms LCP saving). -->
    <link rel="preconnect" href="https://motoscoot.ihebchebbi.pro" crossorigin />
    <link rel="ard" href="/.well-known/ard.json" />

    <!-- LCP optimisation: preload the hero image at the right breakpoint. -->
    <link rel="preload" as="image" href="https://www.moto-scoot.tn/hero-assets/-hero-background.webp" media="(min-width: 768px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/hero-mobile-828.webp" media="(max-width: 767px)" fetchpriority="high" />

    <!-- Non-render-blocking font CSS (PageSpeed flagged 750 ms blocking); system font shows until Inter arrives. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" /></noscript>

    <!-- Critical inline CSS — paints the page immediately so users never see
         the prerendered HTML / unstyled app flash before the JS bundle and
         first committed React render are ready. We hide the entire body during
         pre-hydration, keep only a solid themed background visible, and React
         removes the `data-pre-hydrate` attribute after its first committed
         layout pass. -->
    <script>document.documentElement.classList.add('js')</script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #ffffff;
        color: #0E1116;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        min-height: 100vh;
        min-height: 100dvh;
      }
      @media (prefers-color-scheme: dark) {
        html, body { background-color: #0E1116; color: #f5f5f5; }
      }
      /* Stronger startup lock: hide the whole document body until the app has
         actually committed its first render. This prevents the prerendered SEO
         fallback HTML from flashing for a split second on slower starts. */
      html[data-pre-hydrate] body { visibility: hidden !important; }
      /* Crawler-only fallback text: kept in the DOM for bots, never painted for
         JS visitors (it caused a ~1 s flash of black unstyled text on reload). */
      @media (scripting: enabled) { [data-seo-fallback] { position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; } }
      html.js [data-seo-fallback] { position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
      html[data-pre-hydrate] { background-color: #ffffff; }
      @media (prefers-color-scheme: dark) {
        html[data-pre-hydrate] { background-color: #0E1116; }
      }
    </style>

    <!-- Static JSON-LD for Organization + WebSite. Page-specific JSON-LD is
         injected by components/common/SEO.tsx after hydration, but having a
         minimal block here means crawlers without JS still know who we are. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": ["Organization", "AutoDealer"],
            "@id": "https://www.moto-scoot.tn/#organization",
            "name": "MotoScoot Tunisie",
            "alternateName": "moto-scoot.tn",
            "description": "1ʳᵉ marketplace tunisienne de motos & scooters d'occasion : annonces vérifiées, fiches techniques, garages et conseils.",
            "url": "https://www.moto-scoot.tn/",
            "logo": "https://www.moto-scoot.tn/site-logo/logo-color.svg",
            "image": "https://www.moto-scoot.tn/og-banner.webp",
            "areaServed": {
              "@type": "Country",
              "name": "Tunisia"
            },
            "sameAs": [
              "https://www.facebook.com/moto-scoot.tn",
              "https://www.instagram.com/moto-scoot.tn"
            ],
            "contactPoint": {
              "@type": "ContactPoint",
              "telephone": "+216-29-249-512",
              "contactType": "customer service",
              "areaServed": "TN",
              "availableLanguage": ["French", "Arabic"]
            },
            "address": {
              "@type": "PostalAddress",
              "addressCountry": "TN",
              "addressLocality": "Tunis"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://www.moto-scoot.tn/#website",
            "url": "https://www.moto-scoot.tn/",
            "name": "MotoScoot.tn",
            "alternateName": "MotoScoot Tunisie",
            "publisher": { "@id": "https://www.moto-scoot.tn/#organization" },
            "inLanguage": "fr-TN",
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://www.moto-scoot.tn/annonces?search={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
  </head>
  <body class="font-sans text-foreground bg-background">
    <!-- SEO fallback content for non-JS crawlers (LLMs without rendering, older
         indexers). Hidden visually but parseable. The real React app replaces
         this on hydration. -->
    <div id="root">
      <noscript>
        <h1>MotoScoot.tn — Motos &amp; Scooters d'Occasion en Tunisie</h1>
        <p>Achetez et vendez votre moto ou scooter en Tunisie. Plus de 500 annonces vérifiées à Tunis, Sousse, Sfax et partout ailleurs.</p>
        <p><a href="https://www.moto-scoot.tn/annonces">Voir toutes les annonces</a></p>
      </noscript>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
