<!DOCTYPE html>
<html lang="fr" class="scroll-smooth" data-pre-hydrate>

    <!-- Baseline SEO (overridden per-route by components/common/SEO.tsx). These
         live in source HTML so ndeon-JS crawlers (LLM training bots without JS,
         older indexers, social previews when JS fails) still see meaningful
         metadata before React mounts. -->
    <title>Motos et Scooters en Tunisie | Neufs & Occasion</title>

    <meta name="googlebot" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Moto-Scoot.tn" />
    <meta property="og:locale" content="fr_TN" />
    <meta property="og:title" content="Motos et Scooters en Tunisie | Neufs & Occasion" />
    <meta property="og:description" content="Trouvez, vendez et comparez des motos et scooters en Tunisie : annonces neuves et d'occasion, prix, fiches techniques et nouveautés du marché." />
    <meta property="og:url" content="https://www.moto-scoot.tn/" />

    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->

    <meta name="twitter:site" content="@motoscoot_tn" />
    <meta name="twitter:creator" content="@motoscoot_tn" />

    <meta name="twitter:description" content="Trouvez, vendez et comparez des motos et scooters en Tunisie : annonces neuves et d'occasion, prix, fiches techniques et nouveautés du marché." />

    <link rel="icon" type="image/svg+xml" href="https://www.moto-scoot.tn/site-logo/favicon.svg" />
    <link rel="apple-touch-icon" href="https://www.moto-scoot.tn/site-logo/favicon.svg" />

    <!-- Network preconnects: only the origins we actually load assets from. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://www.moto-scoot.tn" crossorigin />
    <link rel="dns-prefetch" href="https://www.moto-scoot.tn" />
    <!-- Data service: every home section fetches from it (PageSpeed: ~300 ms LCP saving). -->
    <link rel="preconnect" href="https://motoscoot.ihebchebbi.pro" crossorigin />
    <link rel="ard" href="/.well-known/ard.json" />

    <!-- LCP optimisation: preload the hero image at the right breakpoint. -->
    <link rel="preload" as="image" href="https://www.moto-scoot.tn/hero-assets/-hero-background.webp" media="(min-width: 768px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/hero-mobile-828.webp" media="(max-width: 767px)" fetchpriority="high" />

    <!-- Non-render-blocking font CSS (PageSpeed flagged 750 ms blocking); system font shows until Inter arrives. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" /></noscript>

    <!-- Critical inline CSS — paints the page immediately so users never see
         the prerendered HTML / unstyled app flash before the JS bundle and
         first committed React render are ready. We hide the entire body during
         pre-hydration, keep only a solid themed background visible, and React
         removes the `data-pre-hydrate` attribute after its first committed
         layout pass. -->
    <script>document.documentElement.classList.add('js')</script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #ffffff;
        color: #0E1116;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        min-height: 100vh;
        min-height: 100dvh;
      }
      @media (prefers-color-scheme: dark) {
        html, body { background-color: #0E1116; color: #f5f5f5; }
      }
      /* Stronger startup lock: hide the whole document body until the app has
         actually committed its first render. This prevents the prerendered SEO
         fallback HTML from flashing for a split second on slower starts. */
      html[data-pre-hydrate] body { visibility: hidden !important; }
      /* First paint (PageSpeed « délai de rendu », audit 2026-11-11 row 9): the
         prepared text of the page shows at once, laid out like the top of the
         real page (72 px header, breadcrumb, title, intro, main photo), instead
         of a white screen until the app and the API answer. utils/firstPaint.ts
         takes it out of #root before React mounts and removes it as soon as
         the page shows its own title. Only the top of the page is painted; the
         rest stays in the HTML for crawlers. Safety: hidden after 10 s even if
         the JavaScript never runs. */
      html.js [data-seo-fallback] { position:fixed; inset:0; z-index:2147483000; overflow:hidden; display:flex; flex-direction:column; align-items:stretch; background:#fff; color:#161a22; padding:108px 24px 0; font:16px/1.6 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; animation:fp-out 0s linear 10s forwards; }
      html.js [data-seo-fallback]::before { content:""; position:absolute; top:0; left:0; right:0; height:72px; box-sizing:border-box; border-bottom:1px solid #f1f2f4; padding-left:max(24px, calc(50% - 512px)); background:#fff url(/site-logo/logo-color.svg) no-repeat 0 24px / auto 23px; background-origin:content-box; }
      html.js [data-seo-fallback] > * { width:100%; max-width:1024px; margin:0 auto; box-sizing:border-box; }
      html.js [data-seo-fallback] > :not(nav[aria-label="Fil d'Ariane"]):not(h1):not(h1 + p):not(img[data-first-paint]) { display:none; }
      html.js [data-seo-fallback] > nav { order:0; height:20px; margin-bottom:24px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-size:14px; line-height:20px; color:#6b7280; }
      html.js [data-seo-fallback] a { color:inherit; text-decoration:none; }
      html.js [data-seo-fallback] > img[data-first-paint="top"] { order:1; max-width:662px; margin:0 0 24px max(0px, calc((100% - 1024px) / 2)); aspect-ratio:4/3; height:auto; object-fit:cover; border-radius:24px; background:#f3f4f6; }
      html.js [data-seo-fallback] > h1 { order:2; margin:0 auto; font-size:28px; line-height:1.15; font-weight:800; letter-spacing:-0.02em; }
      html.js [data-seo-fallback] > h1 + p { order:3; margin:12px auto 0; color:#4b5563; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
      @media (min-width: 768px) {
        html.js [data-seo-fallback] { padding-top:122px; }
        html.js [data-seo-fallback]::before { background-position:0 22px; background-size:auto 28px; }
        html.js [data-seo-fallback] > h1 { font-size:40px; }
      }
      @keyframes fp-out { to { visibility:hidden; } }
      /* The home page already paints its photo shell from HTML: its text stays crawler-only. */
      html.js [data-home-shell] ~ [data-seo-fallback] { position:absolute!important; width:1px; height:1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
      html.js [data-home-shell] ~ [data-seo-fallback]::before { content:none; }
      html[data-pre-hydrate] { background-color: #ffffff; }
      @media (prefers-color-scheme: dark) {
        html[data-pre-hydrate] { background-color: #0E1116; }
      }
    </style>

</html>
